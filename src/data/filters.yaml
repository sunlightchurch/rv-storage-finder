- id: prices
  slug_prefix: storage-prices
  label: Published storage prices
  vehicles: [rv, boat]
  storage_types: []
  require_power: false
  require_dump: false
  require_wash: false
  require_price: true
  title: "RV storage prices in {city}, {state_code}"
  description: "Published RV and boat storage prices in and near {city}, {state}. {count} facilities print a rate. Figures are copied from the source and are not averaged."
  h1: "RV storage prices in {city}, {state_code}"
  intro: "These facilities in and near {city}, {state} print a price on the page we checked. The figure may be a length tier, a starting rate, or a promotional online rate beside a higher in-store rate. This page does not average them. Facilities that do not print a price are on the city page, with price marked not listed."

