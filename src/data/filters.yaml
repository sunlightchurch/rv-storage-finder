# Each filter becomes one page per city that has at least min_matches facilities (default 1).
# Adding a city file creates these pages automatically. No new template is required.
# Match rules are AND across the flags below.
# vehicles: the listing must include at least one of these.
# storage_types: the listing must include every type listed here (empty = any type).
# require_*: the listing must explicitly have that fact. Silence does not match.

- id: covered-rv
  slug_prefix: covered-rv-storage
  label: Covered RV storage
  vehicles: [rv]
  storage_types: [covered]
  require_power: false
  require_dump: false
  require_wash: false
  require_price: false
  title: "Covered RV storage in {city}, {state_code}"
  description: "Covered RV storage in and near {city}, {state}: {count} sourced facilities. Length, clearance, power, and monthly prices only when published."
  h1: "Covered RV storage in {city}, {state_code}"
  intro: "These facilities in and near {city}, {state} publicly list covered RV storage, such as a roof, canopy, or carport. Lots that do not describe a cover stay on the full city page."

- id: enclosed-rv
  slug_prefix: enclosed-rv-storage
  label: Enclosed RV storage
  vehicles: [rv]
  storage_types: [enclosed]
  require_power: false
  require_dump: false
  require_wash: false
  require_price: false
  title: "Enclosed RV storage in {city}, {state_code}"
  description: "Enclosed and indoor RV storage in and near {city}, {state}: {count} sourced facilities. Door height, length, and monthly prices only when published."
  h1: "Enclosed RV storage in {city}, {state_code}"
  intro: "These facilities in and near {city}, {state} publicly list enclosed or indoor RV storage, such as a garage bay or a warehouse. Covered canopies without walls are on the covered page."

