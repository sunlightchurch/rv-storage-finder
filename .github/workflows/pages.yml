name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Verify HTML, links, and schema
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload sitemap for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: site-sitemap
          path: dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download sitemap
        uses: actions/download-artifact@v4
        with:
          name: site-sitemap
          path: dist
      - name: Ping IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
